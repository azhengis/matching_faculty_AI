<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — DePaul Faculty Matcher</title>
<style>
{{SHELL_CSS}}

/* ── Resume card: the one thing you most likely came back for ── */
.resume{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:26px 28px;box-shadow:var(--sh-md);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.resume-label{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px}
.resume-title{font-family:var(--serif);font-size:25px;letter-spacing:-.008em;margin-bottom:12px;max-width:52ch}
.resume .chips{margin-bottom:0}
.resume .chip-on{background:rgba(255,255,255,.94);color:var(--navy)}
.resume .chip-off{background:rgba(255,255,255,.09);color:rgba(255,255,255,.62);border-color:rgba(255,255,255,.18)}
.resume-actions{display:flex;gap:10px;flex-shrink:0}
.resume .btn-quiet{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28)}
.resume .btn-quiet:hover{background:rgba(255,255,255,.2)}

.project-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:20px 22px;margin-bottom:13px;transition:border-color .15s,box-shadow .15s}
.project-row:hover{border-color:var(--border-2);box-shadow:var(--sh-md)}
.project-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:13px}
.project-row-title{font-family:var(--serif);font-size:21px;line-height:1.35;letter-spacing:-.005em}
.project-row-actions{display:flex;gap:8px;flex-shrink:0}
.project-row-people{font-size:13px;color:var(--ink-2);margin-top:13px;padding-top:13px;border-top:1px solid var(--border)}
.btn-danger-quiet{background:none;border:none;font-size:12.5px;color:var(--ink-3);cursor:pointer;font-family:inherit;text-decoration:underline;padding:0}
.btn-danger-quiet:hover{color:var(--scarlet)}

/* ── Rename title + remove match ── */
.detail-title-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.title-edit-btn{background:none;border:1px solid var(--border-2);border-radius:999px;font-size:11.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;padding:4px 12px;transition:background .15s,color .15s;flex-shrink:0}
.title-edit-btn:hover{background:var(--canvas);color:var(--navy)}
.title-input{font-family:var(--serif);font-size:24px;line-height:1.3;color:var(--ink);background:var(--surface);border:1.5px solid var(--navy-lift);border-radius:var(--r-sm);padding:5px 11px;outline:none;min-width:0;flex:1;box-shadow:0 0 0 3px rgba(11,78,146,.1)}
.btn-sm{padding:7px 14px;font-size:13px}
#detail-people-slot .person{position:relative}
.person-remove{position:absolute;bottom:11px;right:12px;background:var(--surface);border:none;font-size:11px;color:var(--ink-3);cursor:pointer;font-family:inherit;padding:2px 6px;border-radius:6px;opacity:0;transition:opacity .15s,background .15s,color .15s}
#detail-people-slot .person:hover .person-remove,.person-remove:focus-visible{opacity:1}
.person-remove:hover{background:#F5EAEA;color:var(--scarlet)}

/* ── Detail view ── */
.detail-proposal{background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:28px 30px}
.detail-section{margin-bottom:22px}
.detail-section:last-child{margin-bottom:0}
.detail-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);margin-bottom:7px}
.detail-body{font-family:var(--serif);font-size:17px;color:#26313F;line-height:1.7}
.detail-body p{margin-bottom:9px}
.detail-body p:last-child{margin-bottom:0}
.detail-body ul{padding-left:20px;margin:0}
.detail-body li{margin-bottom:5px}
.back-link{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;text-decoration:none;margin-bottom:18px}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="app">
{{SIDEBAR}}
<div class="content">
  <div class="page">
    <div id="loading"><span class="spinner"></span>Loading…</div>

    <!-- ── List view ── -->
    <div id="list-view" style="display:none">
      <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
        <div>
          <h1 id="greeting">Your research</h1>
          <p class="lede">Each project has its own proposal, its own conversation, and its own collaborators.</p>
        </div>
        <button class="btn btn-accent" id="btn-new" onclick="startProject(this)">New project</button>
        <a class="btn" id="btn-explore" href="/explore">Explore directions</a>
      </div>
      <!-- Pick up where you left off: the reason most visits happen. -->
      <div id="resume-slot"></div>
      <div id="list-slot"></div>
    </div>

    <!-- ── Detail view ── -->
    <div id="detail-view" style="display:none">
      <a class="back-link" href="#" onclick="showList(); return false;">← All projects</a>
      <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
        <div style="min-width:0">
          <div class="eyebrow">Project</div>
          <div class="detail-title-row">
            <h1 id="detail-title"></h1>
            <button class="title-edit-btn" onclick="startEditTitle()" title="Rename project" aria-label="Rename project">Rename</button>
          </div>
        </div>
        <div style="display:flex;gap:9px;flex-shrink:0">
          <a class="btn btn-accent" id="detail-chat">Continue the conversation</a>
          <a class="btn btn-quiet" id="detail-download">Download</a>
        </div>
      </div>
      <div class="split">
        <div id="detail-proposal-slot"></div>
        <aside class="rail" id="detail-people-section" style="display:none">
          <div>
            <div class="section-head"><h2>People this matched</h2></div>
            <div id="detail-people-slot" style="display:flex;flex-direction:column;gap:12px"></div>
          </div>
        </aside>
      </div>
    </div>

  </div>
</div>
</div>

<script>
const SECTION_LABELS = {
  abstract:'Abstract', problem_statement:'Problem statement', novelty:'Novelty & contribution',
  background:'Background', objectives:'Objectives', research_questions:'Research questions',
  related_work:'Literature review', methodology:'Methodology',
  ai_role:'Role of AI & data science', ethical_considerations:'Ethical considerations',
  expected_outcomes:'Expected outcomes',
};
const SECTION_ORDER = Object.keys(SECTION_LABELS);

let _projects = [];
let _detailId = null;   // project currently open in the detail view

(async function init() {
  let me;
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) throw new Error('not logged in');
    me = await res.json();
  } catch (e) { window.location.href = '/login'; return; }
  document.getElementById('sidebar-email').textContent = me.email || '';

  let profile = null;
  try {
    const res = await fetch('/api/profile/me');
    if (!res.ok) { window.location.href = '/profile'; return; }
    profile = await res.json();
  } catch (e) { window.location.href = '/profile'; return; }

  const first = (profile.name || '').trim().split(/\s+/)[0];
  if (first) document.getElementById('greeting').textContent = `Welcome back, ${first}`;

  await loadProjects();
  document.getElementById('loading').style.display = 'none';

  const open = new URLSearchParams(location.search).get('open');
  if (open) { showDetail(open); return; }
  showList();
})();

async function loadProjects() {
  try {
    const res  = await fetch('/api/projects');
    const data = await res.json();
    _projects  = data.projects || [];
  } catch (e) { _projects = []; }
}

function hideAll() {
  ['list-view','detail-view'].forEach(id =>
    document.getElementById(id).style.display = 'none');
}

// ── List ─────────────────────────────────────────────────────────────────────
function showList() {
  hideAll();
  document.getElementById('list-view').style.display = 'block';
  history.replaceState({}, '', '/projects');

  renderResume();

  const slot = document.getElementById('list-slot');
  if (!_projects.length) {
    slot.innerHTML = `
      <div class="empty">
        <h3>No projects yet</h3>
        <button class="btn btn-accent" onclick="startProject(this)">Start your first project</button>
      </div>`;
    return;
  }
  slot.innerHTML = _projects.map(p => `
    <div class="project-row">
      <div class="project-row-top">
        <div class="project-row-title">${esc(p.title)}</div>
        <div class="project-row-actions">
          <a class="btn btn-primary btn-sm" href="/advisor?project=${p.id}">
            ${p.started_chat ? 'Continue' : 'Talk it through'}</a>
          <button class="btn btn-quiet btn-sm" onclick="showDetail(${p.id})">Open</button>
        </div>
      </div>
      <div class="chips">${sectionChips(p.sections_written)}</div>
      <div class="project-row-people">
        ${peopleLine(p)}
        <button class="btn-danger-quiet" style="float:right" onclick="deleteProject(${p.id})">Delete</button>
      </div>
    </div>`).join('');
}

// The most recently touched project, surfaced above the list. This was the
// dashboard's whole reason to exist as a separate page; it is one card.
function renderResume() {
  const slot = document.getElementById('resume-slot');
  if (_projects.length < 2) { slot.innerHTML = ''; return; }

  const p = _projects[0];
  slot.innerHTML = `
    <div class="resume">
      <div style="min-width:0">
        <div class="resume-label">Pick up where you left off</div>
        <div class="resume-title">${esc(p.title)}</div>
        <div class="chips">${sectionChips(p.sections_written)}</div>
      </div>
      <div class="resume-actions">
        <a class="btn btn-accent" href="/advisor?project=${p.id}">
          ${p.started_chat ? 'Continue the conversation' : 'Talk it through'}</a>
        <button class="btn btn-quiet" onclick="showDetail(${p.id})">Open project</button>
      </div>
    </div>`;
}

function peopleLine(p) {
  if (!p.match_names || !p.match_names.length) {
    return p.started_chat ? 'No collaborators surfaced yet.'
                          : 'Not started yet — the advisor finds collaborators once you talk it through.';
  }
  const shown = p.match_names.slice(0, 3).map(esc).join(', ');
  return `Matched with ${shown}${p.match_names.length > 3 ? ' and others' : ''}.`;
}

function sectionChips(written) {
  const set = new Set(written || []);
  return SECTION_ORDER.map(k =>
    `<span class="chip ${set.has(k) ? 'chip-on' : 'chip-off'}">${SECTION_LABELS[k]}</span>`
  ).join('');
}

// ── Intake ───────────────────────────────────────────────────────────────────
// Chat-first, per Bamshad's guidance: the advisor IS the intake. A form of
// open questions accepted whatever vagueness it was given and seeded it
// straight into proposal sections, bypassing the Stage-1 specificity gates the
// advisor enforces one question at a time. Anyone with existing notes can
// paste them as their first chat message — Stage 1 interviews from there.
// Someone without a problem yet goes to /explore instead, which hands a chosen
// direction back here as a project.
async function startProject(btn) {
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  try {
    const res  = await fetch('/api/projects', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ start_blank: true })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start the project');
    window.location.href = `/advisor?project=${data.project_id}`;
  } catch (e) {
    alert(e.message);
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

async function deleteProject(id) {
  if (!confirm('Delete this project, its proposal, and its matches? This cannot be undone.')) return;
  try {
    await fetch('/api/projects/' + id, { method: 'DELETE' });
    await loadProjects();
    showList();
  } catch (e) { alert('Could not delete: ' + e.message); }
}

// ── Detail ───────────────────────────────────────────────────────────────────
async function showDetail(id) {
  let data;
  try {
    const res = await fetch('/api/projects/' + id);
    data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not found');
  } catch (e) { showList(); return; }

  hideAll();
  document.getElementById('detail-view').style.display = 'block';
  history.replaceState({}, '', '/projects?open=' + id);

  _detailId = id;
  renderTitleRow(data.title);
  document.getElementById('detail-chat').href = `/advisor?project=${id}`;
  document.getElementById('detail-chat').textContent =
    data.session_id ? 'Continue the conversation' : 'Talk it through';

  const dl = document.getElementById('detail-download');
  const hasContent = SECTION_ORDER.some(k => (data.proposal[k] || '').trim());
  dl.href = `/api/projects/${id}/proposal/download`;
  dl.style.display = hasContent ? '' : 'none';

  const written = SECTION_ORDER.filter(k => (data.proposal[k] || '').trim());
  document.getElementById('detail-proposal-slot').innerHTML = written.length
    ? '<div class="detail-proposal">' + written.map(k => `
        <div class="detail-section">
          <div class="detail-label">${SECTION_LABELS[k]}</div>
          <div class="detail-body">${textToHtml(data.proposal[k])}</div>
        </div>`).join('') + '</div>'
    : `<div class="empty"><h3>Nothing written yet</h3>
         <p>Talk this project through with the advisor and the proposal builds itself here.</p>
         <a class="btn btn-accent" href="/advisor?project=${id}">Talk it through</a></div>`;

  const people = data.matches || [];
  // '' restores the .rail class's flex layout; 'block' would flatten its gaps.
  document.getElementById('detail-people-section').style.display = people.length ? '' : 'none';
  document.getElementById('detail-people-slot').innerHTML = people.map(m => `
    <div class="person" data-faculty="${m.faculty_id||''}" onclick="openFacultyProfile(${m.faculty_id||0})">
      <button class="person-remove" title="Remove this person"
              onclick="event.stopPropagation(); removeMatch(${m.id}, this)">Remove</button>
      <div class="person-top">
        <div class="person-name">${esc(m.name)}</div>
        ${m.match_tier ? `<span class="tier tier-${esc(m.match_tier)}">${esc(m.match_tier)}</span>` : ''}
      </div>
      <div class="person-meta">${esc(m.title || '')}${m.title && m.department ? ' · ' : ''}${esc(m.department || '')}</div>
      ${m.why_match ? `<div class="person-why">${esc(m.why_match)}</div>` : ''}
      ${relevantWorkHtml(m.relevant_work)}
      ${m.email ? `<a class="person-email" href="mailto:${esc(m.email)}" onclick="event.stopPropagation()">${esc(m.email)}</a>` : ''}
    </div>`).join('');
}

// ── Rename the project ─────────────────────────────────────────────────────────
function renderTitleRow(title) {
  document.querySelector('.detail-title-row').innerHTML =
    `<h1 id="detail-title"></h1>` +
    `<button class="title-edit-btn" onclick="startEditTitle()" title="Rename project" aria-label="Rename project">Rename</button>`;
  document.getElementById('detail-title').textContent = title;
}

function startEditTitle() {
  const h1 = document.getElementById('detail-title');
  if (document.getElementById('title-input')) return;   // already editing
  const current = h1.textContent;
  const row = document.querySelector('.detail-title-row');
  row.innerHTML =
    `<input id="title-input" class="title-input" type="text" maxlength="120" value="${esc(current)}">` +
    `<button class="btn btn-accent btn-sm" onclick="saveTitle()">Save</button>` +
    `<button class="btn btn-quiet btn-sm" onclick="showDetail(_detailId)">Cancel</button>`;
  const input = document.getElementById('title-input');
  input.focus(); input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') saveTitle();
    if (e.key === 'Escape') showDetail(_detailId);
  });
}

async function saveTitle() {
  const input = document.getElementById('title-input');
  const title = (input.value || '').trim();
  if (!title) { input.focus(); return; }
  try {
    const res = await fetch('/api/projects/' + _detailId, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title })
    });
    if (!res.ok) throw new Error();
  } catch (e) { /* fall through to reload, which shows the saved value */ }
  await showDetail(_detailId);   // re-render header, and refresh the list underneath
  loadProjects();
}

// ── Remove a matched collaborator ──────────────────────────────────────────────
async function removeMatch(matchId, btn) {
  const card = btn.closest('.person');
  card.style.opacity = '0.5';
  try {
    const res = await fetch(`/api/projects/${_detailId}/matches/${matchId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    card.remove();
    // Hide the whole panel if that was the last one.
    if (!document.querySelectorAll('#detail-people-slot .person').length)
      document.getElementById('detail-people-section').style.display = 'none';
  } catch (e) {
    card.style.opacity = '';   // restore on failure
  }
}

function textToHtml(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  const isBullet = l => l.startsWith('- ') || l.startsWith('• ');
  let html = '', buf = [];
  const flush = () => {
    if (buf.length) {
      html += '<ul>' + buf.map(l => `<li>${esc(l.replace(/^[-•]\s+/, ''))}</li>`).join('') + '</ul>';
      buf = [];
    }
  };
  for (const l of lines) {
    if (isBullet(l)) buf.push(l);
    else { flush(); html += `<p>${esc(l)}</p>`; }
  }
  flush();
  return html;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}
</script>
</body>
</html>
