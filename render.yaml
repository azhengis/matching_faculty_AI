# Render blueprint.
#
# On the STARTER plan (0.5 CPU / 512MB) with a 1GB disk. That combination buys
# the two things free could not:
#
#   1. USER DATA SURVIVES A DEPLOY. Without a disk the database lives in the
#      container filesystem and is destroyed on every restart and redeploy.
#      Faculty data came back because it is baked into the image, but every
#      account, project and proposal anyone had created was gone. Paying for
#      the instance alone does NOT fix this — the disk is the half that does.
#   2. NO SLEEPING. Free instances sleep after 15 minutes idle and the next
#      request pays a cold start, which is what produced the request timeouts
#      in the advisor chat.
#
# The plan, the disk and DATA_DIR move as ONE UNIT. A disk cannot be declared
# on a free instance (Render rejects the deploy), DATA_DIR without a disk
# points the database at a path nothing persists, and a disk without DATA_DIR
# is the quiet one: the app writes to the container filesystem while the paid
# volume sits empty beside it, losing exactly what it was bought to keep.
# A test asserts all three agree.
#
# Memory: the app measures ~280MB resident (15MB python, +36 numpy/fastapi,
# +64 faculty rows, +59 both embedding indexes, +~110 the ONNX model), so it
# runs at roughly 55% of 512MB.
#
# Custom domains are FREE on Render, TLS included — Settings -> Custom Domains.
# The only cost is the name itself from a registrar, and a depaul.edu subdomain
# from campus IT would cost nothing at all.
services:
  - type: web
    name: depaul-faculty-matcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio                     # closest Render region to Chicago
    healthCheckPath: /login          # returns 200 without a session; / redirects

    # Everything that must outlive a deploy: accounts, projects, proposals and
    # uploaded documents. A test asserts DATA_DIR still equals disk.mountPath —
    # if those drift, the app writes to the container filesystem while the paid
    # disk sits empty beside it, losing exactly what it was bought to keep.
    disk:
      name: faculty-data
      mountPath: /data
      sizeGB: 1                      # database ~13MB plus uploaded documents

    envVars:
      - key: DATA_DIR
        value: /data                 # must match disk.mountPath above
      - key: CHATBOT_MODEL
        value: anthropic/claude-sonnet-5   # Sonnet, not Haiku: the advisor is the product, and Haiku kept grading answers ("that's a big canvas") through four prompt iterations. ~3x per-token cost, still tens of cents per full proposal conversation.
      - key: ANTHROPIC_API_KEY
        sync: false                  # set in the dashboard; never commit it
