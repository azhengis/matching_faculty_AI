# Fly.io config. Walkthrough and the data-seeding step: docs/DEPLOYMENT.md
# `fly launch` will rename the app if this one is taken.
app = "depaul-faculty-matcher"
primary_region = "ord"          # Chicago — closest region to DePaul

[build]
  dockerfile = "Dockerfile"

[env]
  # Everything that must outlive a deploy goes on the mounted volume.
  DATA_DIR = "/data"
  CHATBOT_MODEL = "anthropic/claude-haiku-4-5"
  # ANTHROPIC_API_KEY is NOT set here — it is a secret.
  #   fly secrets set ANTHROPIC_API_KEY=sk-...

[[mounts]]
  source = "faculty_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Never scale to zero: a cold start reloads SPECTER2 and rebuilds nothing,
  # but still costs ~30s before the first byte. Suspend keeps memory warm.
  min_machines_running = 1

[[vm]]
  # Measured, not guessed: 280MB steady state after a real query encode and a
  # 25-pair cross-encoder rerank, and 285MB peak while rebuilding the faculty
  # index from scratch. 512MB leaves comfortable headroom; 256MB does not.
  # Ship the prebuilt indexes (see docs/DEPLOYMENT.md) so the host never pays
  # the rebuild cost at all.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 2
