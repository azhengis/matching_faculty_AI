# Fly.io config. Walkthrough and the data-seeding step: docs/DEPLOYMENT.md
# `fly launch` will rename the app if this one is taken.
app = "depaul-faculty-matcher"
primary_region = "ord"          # Chicago — closest region to DePaul

[build]
  dockerfile = "Dockerfile"

[env]
  # Everything that must outlive a deploy goes on the mounted volume.
  DATA_DIR = "/data"
  # Sonnet, not Haiku. Haiku kept grading answers ("that's a big canvas")
  # through four prompt iterations, and the advisor is the product. Kept in
  # step with render.yaml deliberately — the two must not disagree about which
  # model the researcher is talking to.
  CHATBOT_MODEL = "anthropic/claude-sonnet-5"
  # ANTHROPIC_API_KEY is NOT set here — it is a secret.
  #   fly secrets set ANTHROPIC_API_KEY=sk-...

[[mounts]]
  source = "faculty_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Never scale to zero: a cold start reloads SPECTER2 and rebuilds nothing,
  # but still costs ~30s before the first byte. Suspend keeps memory warm.
  min_machines_running = 1

[[vm]]
  # 2GB to start, deliberately more than needed. Budget, measured:
  #
  #     ~150MB  python + numpy + fastapi + onnxruntime + litellm
  #     ~110MB  the int8 ONNX model
  #      ~13MB  faculty rows
  #       ~4MB  faculty index
  #     -------
  #     ~330MB  unavoidable at startup
  #      +56MB  paper index, once a collaborator search runs
  #
  # That suggests 512MB should fit. It does not: a 512MB container was
  # OOM-killed during boot on Render, twice, and the reason is not in the list
  # above — allocator overhead, page cache counted against the cgroup, and the
  # transient cost of unpickling an index while still holding its bytes.
  #
  # The honest answer is that nobody has measured the real peak, because every
  # deploy that would have printed it failed before printing anything. So this
  # starts high on purpose. Startup logs "Ready — ... peak NNNMB"; read it, then
  #
  #     fly scale memory 1024
  #
  # and watch it again. Sizing down from a known number beats guessing upward
  # from a failure.
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2
